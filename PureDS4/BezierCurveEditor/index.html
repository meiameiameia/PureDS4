<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curve editor · PureDS4</title>
  <style>
    :root { color-scheme: light; --base: #e0e6ea; --surface: #fff; --text: #20272c; --muted: #515e67; --border: #65727c; --accent: #2e647f; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --base: #10171d; --surface: #202b34; --text: #edf2f6; --muted: #c5d0d8; --border: #718390; --accent: #89b8d6; }
    }
    * { box-sizing: border-box; }
    body { margin: 0 auto; max-width: 1040px; padding: 24px !important; background: var(--base) !important; color: var(--text) !important; font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", sans-serif !important; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    h3 { font-size: 14px; font-weight: 600; }
    p { max-width: 800px; color: var(--muted); }
    a { color: var(--accent) !important; text-decoration: underline !important; }
    input:not([type="checkbox"]), button { min-height: 32px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 2px; background: var(--surface); color: var(--text); font: inherit; }
    input[type="checkbox"] { accent-color: var(--accent); margin-right: 8px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    code { font: 14px "Cascadia Mono", Consolas, monospace; user-select: all; }
    table { width: 100%; border-collapse: collapse; }
    td { vertical-align: top; padding: 8px; }
    td button { margin: 4px 0; text-align: left; width: 100%; cursor: pointer; }
    td button:hover { border-color: var(--accent); }
    /* The inherited graph has a fixed coordinate system and dark axis labels. */
    svg { box-sizing: content-box; background: #fff; color-scheme: light; outline: 1px solid var(--border); }
    @media (max-width: 700px) { body { padding: 16px !important; } table, tbody, tr, td { display: block; } }
  </style>
</head>
<body>
  <script src="build.js"></script>
</body>
</html>
