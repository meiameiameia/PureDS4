name: CI Build

# Autobuild that runs on every push and pull request, plus manual triggers.
# Public release automation is intentionally absent until provenance,
# unsigned-distribution checks, and release-channel gates are complete. Only
# manually dispatched runs retain downloadable CI artifacts; push and PR runs
# still build and test everything.

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]   # Public tag builds are not authorized yet.
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      release_candidate:
        description: 'Build a target-version validation candidate (does not publish a release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Verify pinned .NET SDK
        shell: pwsh
        run: |
          $expected = (Get-Content .\global.json -Raw | ConvertFrom-Json).sdk.version
          $actual = dotnet --version
          if ($actual -ne $expected) {
            throw "Expected .NET SDK $expected but selected $actual."
          }

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore dependencies
        run: dotnet restore .\PureDS4.sln --locked-mode

      - name: Check package security advisories
        shell: pwsh
        run: |
          $report = dotnet list .\PureDS4.sln package --vulnerable --include-transitive --no-restore --format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "NuGet advisory query failed." }
          if (-not $report.sources -or -not $report.projects) {
            throw "NuGet advisory query returned no source or projects."
          }
          $affected = @($report.projects | ForEach-Object { $_.frameworks } |
            ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
            Where-Object { $_.vulnerabilities.Count -gt 0 })
          if ($affected.Count -gt 0) {
            $affected | ConvertTo-Json -Depth 8 | Write-Host
            throw "A restored dependency has a reported security advisory."
          }

      - name: Test release-input gate
        run: python .\utils\test-release-inputs.py

      - name: Test managed-notice gate
        run: python .\utils\test-managed-notices.py

      - name: Run tests (x64)
        # The whole suite gates the build. The three XML snapshot tests that
        # were excluded here (CheckSettingsSave, CheckWriteProfile,
        # CheckJaysProfileRead) now pass against the regenerated fixtures, so
        # the filter that hid them is gone.
        # Exercise the same pinned runtime shipped to users rather than the
        # older shared runtime that happens to come with the selected SDK.
        run: dotnet test .\PureDS4.Tests\PureDS4.Tests.csproj -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true --filter "FullyQualifiedName!~LiveProcessCapture" --verbosity normal

  build:
    runs-on: windows-2022
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Verify pinned .NET SDK
        shell: pwsh
        run: |
          $expected = (Get-Content .\global.json -Raw | ConvertFrom-Json).sdk.version
          $actual = dotnet --version
          if ($actual -ne $expected) {
            throw "Expected .NET SDK $expected but selected $actual."
          }

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore dependencies
        run: |
          dotnet restore .\PureDS4.sln --locked-mode
          dotnet restore .\installer\PureDS4.SetupActions\PureDS4.SetupActions.csproj --locked-mode
          dotnet restore .\installer\PureDS4.Bootstrapper\PureDS4.Bootstrapper.csproj --locked-mode
          dotnet restore .\installer\PureDS4.Package\PureDS4.Package.wixproj --locked-mode
          dotnet restore .\installer\PureDS4.Bundle\PureDS4.Bundle.wixproj --locked-mode

      - name: Validate content-addressed release inputs
        run: python .\utils\validate-release-inputs.py --verify-signatures

      - name: Compute version
        id: ver
        shell: pwsh
        env:
          RELEASE_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate }}
        run: |
          $identity = .\utils\get-build-identity.ps1 `
            -ReleaseCandidate:($env:RELEASE_CANDIDATE -eq 'true')
          "VERSION=$($identity.DisplayVersion)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "PRODUCT_VERSION=$($identity.ProductVersion)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BUNDLE_VERSION=$($identity.BundleVersion)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BUILD_KIND=$($identity.Kind)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "version=$($identity.DisplayVersion)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Build ${{ matrix.platform }}
        run: dotnet publish .\PureDS4\PureDS4.csproj -c Release /p:platform=${{ matrix.platform }} -r win-${{ matrix.platform }} --self-contained true --no-restore -o .\bin\${{ matrix.platform }}\Release\output

      - name: Package ${{ matrix.platform }}
        run: python .\utils\post-build.py .\bin\${{ matrix.platform }}\Release\output . ${{ env.VERSION }}

      - name: Build standard installer
        shell: pwsh
        run: |
          .\installer\build-installer.ps1 `
            -PublishRoot ".\bin\${{ matrix.platform }}\Release\PureDS4" `
            -ProductVersion "${{ env.PRODUCT_VERSION }}" `
            -BundleVersion "${{ env.BUNDLE_VERSION }}" `
            -DisplayVersion "${{ env.VERSION }}" `
            -OutputDirectory ".\bin\${{ matrix.platform }}\Release\installer" `
            -SkipApplicationPublish

      - name: Validate offline installer layout plan
        shell: pwsh
        run: |
          $installer = ".\bin\${{ matrix.platform }}\Release\installer\PureDS4_${{ env.VERSION }}_Setup_${{ matrix.platform }}.exe"
          $layout = ".\bin\${{ matrix.platform }}\Release\installer-layout"
          $process = Start-Process -FilePath $installer `
            -ArgumentList "/layout `"$layout`" /quiet" `
            -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Installer layout planning failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path $layout) -or -not (Get-ChildItem $layout -File -Recurse)) {
            throw "Installer layout planning produced no offline payloads."
          }

      - name: Exercise MSI install, repair, and uninstall lifecycle
        shell: pwsh
        run: |
          $msi = (Resolve-Path ".\installer\PureDS4.Package\bin\x64\Release\PureDS4_${{ env.PRODUCT_VERSION }}_x64.msi").Path
          $msiexec = Join-Path $env:SystemRoot "System32\msiexec.exe"
          $logRoot = Join-Path $env:RUNNER_TEMP "pureds4-msi-lifecycle"
          New-Item -ItemType Directory -Path $logRoot -Force | Out-Null
          function Invoke-Msi([string]$arguments, [string]$phase) {
            $process = Start-Process -FilePath $msiexec `
              -ArgumentList "$arguments /qn /norestart /L*v `"$logRoot\$phase.log`"" `
              -PassThru -Wait
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "MSI $phase failed with $($process.ExitCode). Log: $logRoot\$phase.log"
            }
          }

          try {
            Invoke-Msi "/i `"$msi`"" "install"
            if (-not (Test-Path "$env:ProgramFiles\PureDS4\PureDS4.exe")) {
              throw "MSI install completed without its application keypath."
            }
            Invoke-Msi "/fa `"$msi`"" "repair"
          }
          finally {
            Invoke-Msi "/x `"$msi`"" "uninstall"
          }
          if (Test-Path "HKLM:\SOFTWARE\PureDS4") {
            $installPath = Get-ItemPropertyValue `
              -Path "HKLM:\SOFTWARE\PureDS4" -Name InstallPath `
              -ErrorAction SilentlyContinue
            if ($installPath) {
              throw "MSI uninstall left its machine registration behind."
            }
          }

      - name: Record exact candidate identity
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $components = [ordered]@{
            application = '.\PureDS4\obj\project.assets.json'
            setupActions = '.\installer\PureDS4.SetupActions\obj\project.assets.json'
            bootstrapper = '.\installer\PureDS4.Bootstrapper\obj\project.assets.json'
          }
          $runtimeNames = @('Microsoft.NETCore.App.Runtime.win-x64', 'Microsoft.WindowsDesktop.App.Runtime.win-x64')
          $runtimePacks = @()
          foreach ($component in $components.Keys) {
            $assets = Get-Content -LiteralPath $components[$component] -Raw | ConvertFrom-Json
            $framework = @($assets.project.frameworks.PSObject.Properties.Value)
            if ($framework.Count -ne 1) { throw "Expected one framework for $component." }
            foreach ($name in $runtimeNames) {
              $entry = @($framework[0].downloadDependencies | Where-Object { $_.name -eq $name })
              if ($entry.Count -ne 1 -or $entry[0].version -notmatch '^\[(\d+\.\d+\.\d+), \1\]$') {
                throw "Cannot identify the exact $component $name runtime pack from restore assets."
              }
              $version = $Matches[1]
              if ([version]$version -lt [version]'10.0.12' -or ([version]$version).Major -ne 10) {
                throw "$component $name is stale or uses the wrong runtime: $version (reviewed .NET 10 minimum: 10.0.12)."
              }
              $runtimePacks += [ordered]@{ component = $component; name = $name; version = $version }
            }
          }
          if (@($runtimePacks | ForEach-Object { $_.version } | Select-Object -Unique).Count -ne 1) {
            throw "Application and installer helpers contain different .NET runtime patches."
          }
          $zip = ".\bin\${{ matrix.platform }}\Release\PureDS4_${{ env.VERSION }}_${{ matrix.platform }}.zip"
          $installer = ".\bin\${{ matrix.platform }}\Release\installer\PureDS4_${{ env.VERSION }}_Setup_${{ matrix.platform }}.exe"
          $files = @(@($zip, $installer) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Missing candidate artifact: $_" }
            $file = Get-Item -LiteralPath $_
            [ordered]@{ name = $file.Name; bytes = $file.Length; sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $identity = [ordered]@{
            product = 'PureDS4'
            version = '${{ env.VERSION }}'
            kind = $env:BUILD_KIND
            sourceCommit = (git rev-parse HEAD).Trim()
            runtimePacks = $runtimePacks
            installerSignatureStatus = (Get-AuthenticodeSignature -LiteralPath $installer).Status.ToString()
            files = $files
          }
          $output = ".\bin\${{ matrix.platform }}\Release\installer"
          $identity | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $output 'candidate-identity.json') -Encoding utf8
          $files | ForEach-Object { "$($_.sha256) *$($_.name)" } |
            Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Source commit: ``$($identity.sourceCommit)``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Runtime packs: $($runtimePacks[0].version) (application, setup actions, bootstrapper)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Installer signature: $($identity.installerSignatureStatus)"
          $files | ForEach-Object { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "SHA-256 ``$($_.name)``: ``$($_.sha256)``" }

      - name: Upload portable ZIP
        if: github.event_name == 'workflow_dispatch'
        id: upload_portable
        uses: actions/upload-artifact@v4
        with:
          name: PureDS4_${{ env.VERSION }}_${{ matrix.platform }}_Portable
          path: |
            .\bin\${{ matrix.platform }}\Release\PureDS4_${{ env.VERSION }}_${{ matrix.platform }}.zip
            .\bin\${{ matrix.platform }}\Release\installer\candidate-identity.json
            .\bin\${{ matrix.platform }}\Release\installer\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload standard installer EXE
        if: github.event_name == 'workflow_dispatch'
        id: upload_installer
        uses: actions/upload-artifact@v4
        with:
          name: PureDS4_${{ env.VERSION }}_Setup_${{ matrix.platform }}
          path: |
            .\bin\${{ matrix.platform }}\Release\installer\PureDS4_${{ env.VERSION }}_Setup_${{ matrix.platform }}.exe
            .\bin\${{ matrix.platform }}\Release\installer\candidate-identity.json
            .\bin\${{ matrix.platform }}\Release\installer\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

      - name: Publish artifact link to run summary
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "### PureDS4 ${{ matrix.platform }} build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \`${{ env.VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Portable ZIP](${{ steps.upload_portable.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Standard installer EXE](${{ steps.upload_installer.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
